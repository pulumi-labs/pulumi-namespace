# Provider configuration: this example uses the default provider. Set namespace:token (secret), namespace:region with
# `pulumi config set [--secret] <key> <value>`, or export NSC_TOKEN, NSC_REGION.
name: namespace-ci-platform-yaml
runtime: yaml
description: A CI platform on Namespace Cloud (runner profile, egress policy, token, registry policy) with Pulumi (YAML)

resources:
  ci-egress:
    type: namespace:index:EgressPolicy
    properties:
      tag: ci-locked-down
      description: Only package registries and GitHub
      mode: BLOCK
      rules:
        - op: ALLOW
          matcher:
            matchDomains: [github.com, "*.githubusercontent.com", registry.npmjs.org]
  ci-runner:
    type: namespace:index:GithubProfile
    properties:
      tag: ci-medium
      instanceShape:
        virtualCpu: 4
        memoryMegabytes: 8192
      networkPolicy:
        egress: EGRESS_POLICY_TAG
        egressPolicyTag: ${ci-egress.tag}
  ci-tenants:
    type: namespace:index:TenantGroup
    properties:
      name: ci-tenants
  ci-token:
    type: namespace:index:RevokableToken
    properties:
      name: ci-automation
      scope: TENANT_SCOPE
      grants:
        - resourceType: instance
          resourceId: "*"
          actions: [read]
  ci-images:
    type: namespace:index:RegistryRepositoryPolicy
    properties:
      repository: ci/runner
      expirationSeconds: 1209600
      expirationEnforcement: EXPIRATION_ENFORCEMENT_ENFORCE

variables:
  repos:
    fn::invoke:
      function: namespace:index:getRegistryRepositories
      return: repositories

outputs:
  profileId: ${ci-runner.profileId}
  groupName: ${ci-tenants.name}
  tokenId: ${ci-token.tokenId}
  bearerToken: ${ci-token.bearerToken}
  repositories: ${repos}
  policyRevision: ${ci-images.revision}
