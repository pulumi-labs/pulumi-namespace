name: ${PROJECT}
description: ${DESCRIPTION}
runtime: yaml

template:
  description: A YAML program to provision a Namespace Cloud vault secret, an ephemeral container instance, and an IAM tenant.
  config:
    nscToken:
      description: Namespace Cloud API token (from `nsc auth generate-dev-token` or a revokable token). Never commit it.
      secret: true
    dbPassword:
      description: Secret value to store in the Namespace vault.
      secret: true
    region:
      description: Namespace compute region for instances (us or eu).
      default: us

config:
  nscToken:
    type: string
    secret: true
  dbPassword:
    type: string
    secret: true
  region:
    type: string
    default: us

resources:
  # Explicit provider so the token comes from stack config (a secret), not a
  # hardcoded value. NSC_TOKEN in the environment works too.
  namespace:
    type: pulumi:providers:namespace
    properties:
      token: ${nscToken}
      region: ${region}

  # A versioned secret in the Namespace vault. Only value updates in place.
  db-password:
    type: namespace:index:VaultObject
    properties:
      value: ${dbPassword}
      description: Database password for the build cache
      revealable: false
      labels:
        team: platform
    options:
      provider: ${namespace}

  # An ephemeral container instance. Instances are destroyed at their
  # deadline, so treat them as disposable compute for CI jobs, agents, and
  # sandboxes.
  sandbox:
    type: namespace:index:Instance
    properties:
      shape:
        virtualCpu: 2
        memoryMegabytes: 4096
        machineArch: amd64
        os: linux
      documentedPurpose: Agent sandbox
      containers:
        - name: web
          imageRef: nginx:1.27
          exportPorts:
            - name: http
              containerPort: 80
              proto: HTTP
    options:
      provider: ${namespace}

  # An IAM tenant: an isolated account with its own policies.
  customer-a:
    type: namespace:index:Tenant
    properties:
      visibleName: Customer A
      labels:
        tier: free
    options:
      provider: ${namespace}

outputs:
  secretVersion: ${db-password.version}
  instanceId: ${sandbox.instanceId}
  instanceStatus: ${sandbox.status}
  ingressDomain: ${sandbox.ingressDomain}
  tenantId: ${customer-a.tenantId}
